<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach of Vespers - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-container {
            padding: 40px 30px;
            text-align: center;
        }

        .welcome-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .google-btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: #444;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .google-btn:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .google-btn:active {
            transform: translateY(0);
        }

        .google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 15px;
            padding: 10px;
            background: #fadbd8;
            border-radius: 8px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            font-size: 14px;
        }

        .loading.show {
            display: block;
        }

        .info-text {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Reach of Vespers</h1>
            <p>Vivez l'aventure</p>
        </div>

        <div class="form-container">
            <div class="welcome-text">Connexion rapide</div>
            <div class="subtitle">Connecte-toi avec ton compte Google</div>

            <button id="google-signin-btn" class="google-btn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continuer avec Google
            </button>

            <div class="loading" id="loading">Connexion en cours...</div>
            <div class="error-message" id="error-message"></div>

            <div class="info-text">
                En te connectant, ton compte sera créé automatiquement si c'est ta première visite.
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBpFK6tLtdcYbGo372qn3EoB-CzkCFO7w",
            authDomain: "reachofvespers-4b501.firebaseapp.com",
            projectId: "reachofvespers-4b501",
            storageBucket: "reachofvespers-4b501.firebasestorage.app",
            messagingSenderId: "65089586909",
            appId: "1:65089586909:web:7d524beaf3a0d3211cfd34",
            measurementId: "G-0X8HLDCGNS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const googleSignInBtn = document.getElementById('google-signin-btn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');

        // Vérifier si l'utilisateur est déjà connecté
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Utilisateur connecté, rediriger vers la page du jeu
                window.location.href = 'index.html'; // Changez par votre page de jeu
            }
        });

        // Fonction pour afficher les erreurs
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function clearError() {
            errorMessage.classList.remove('show');
        }

        // Gestion de la connexion Google
        googleSignInBtn.addEventListener('click', async () => {
            clearError();
            googleSignInBtn.disabled = true;
            loading.classList.add('show');

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Vérifier si c'est un nouvel utilisateur
                const userDocRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userDocRef);

                if (!userDoc.exists()) {
                    // Créer le document utilisateur pour les nouveaux comptes
                    await setDoc(userDocRef, {
                        username: user.displayName,
                        email: user.email,
                        photoURL: user.photoURL,
                        createdAt: new Date(),
                        lastLogin: new Date()
                    });
                } else {
                    // Mettre à jour la dernière connexion
                    await setDoc(userDocRef, {
                        lastLogin: new Date()
                    }, { merge: true });
                }

                // La redirection est gérée automatiquement par onAuthStateChanged
            } catch (error) {
                console.error('Erreur de connexion:', error);
                
                let errorMsg = 'Une erreur est survenue lors de la connexion';
                
                if (error.code === 'auth/popup-closed-by-user') {
                    errorMsg = 'La fenêtre de connexion a été fermée';
                } else if (error.code === 'auth/popup-blocked') {
                    errorMsg = 'Les popups sont bloquées. Autorise-les pour te connecter';
                } else if (error.code === 'auth/cancelled-popup-request') {
                    errorMsg = 'Une autre demande de connexion est en cours';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg = 'Problème de connexion internet';
                }
                
                showError(errorMsg);
                googleSignInBtn.disabled = false;
                loading.classList.remove('show');
            }
        });
    </script>
</body>
</html>
